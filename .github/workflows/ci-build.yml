name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "development" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Docker Login (conditional — only if secrets are configured)
    - name: Docker Login
      if: ${{ secrets.DOCKER_USER != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_KEY }}

    # Fix permissions for Laravel storage/cache (runner UID may differ from container)
    - name: Fix storage permissions
      run: |
        sudo chown -R 1000:1000 src/storage src/bootstrap/cache

    # Build Docker images
    - name: Build Docker Images
      run: make build

    # Start services
    - name: Start Services
      run: make up

    # Install dependencies
    - name: Install Composer Dependencies
      run: make composer cmd="install"

    # Smoke test — proves PHP + framework are wired up
    - name: Smoke Test
      run: make artisan cmd="--version"

    # Teardown
    - name: Teardown
      if: always()
      run: make down-v
